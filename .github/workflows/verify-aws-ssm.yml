name: Verify AWS OIDC and SSM

# First commit to the test branch runs a read-only connectivity check.
# This does not deploy the website or change the EC2 server.
on:
  push:
    branches:
      - test
    paths:
      - .github/workflows/verify-aws-ssm.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: verify-aws-ssm-test
  cancel-in-progress: false

jobs:
  verify:
    name: Verify OIDC authentication and SSM access
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Inspect public OIDC claim values for diagnostics
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
            const endpoint = process.env.ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=sts.amazonaws.com';
            const response = await fetch(endpoint, {
              headers: { Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }
            });
            if (!response.ok) throw new Error('Unable to request OIDC token: HTTP ' + response.status);
            const result = await response.json();
            const payload = JSON.parse(Buffer.from(result.value.split('.')[1], 'base64url').toString('utf8'));
            // Never log the actual token; these are nonsecret routing claims only.
            console.log(JSON.stringify({ issuer: payload.iss, audience: payload.aud, subject: payload.sub }, null, 2));
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE

      - name: Assume AWS deploy role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::461729033931:role/github-actions-deploy-role
          aws-region: ap-northeast-2
          allowed-account-ids: '461729033931'

      - name: Run read-only commands on EC2 through SSM
        shell: bash
        run: |
          set -euo pipefail
          instance_id='i-0bb005f29438601f2'

          command_id="$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["whoami","hostname","systemctl is-active nginx","command -v aws || true","command -v unzip || true","ls -ld /var/www/html /var/www/apps/blockarena || true"]}' \
            --query 'Command.CommandId' --output text)"

          echo "SSM command ID: $command_id"
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$instance_id"

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$instance_id" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text
