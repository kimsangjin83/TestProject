name: Verify AWS OIDC and SSM

# First commit to the test branch runs a read-only connectivity check.
# This does not deploy the website or change the EC2 server.
on:
  push:
    branches:
      - test
    paths:
      - .github/workflows/verify-aws-ssm.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: verify-aws-ssm-test
  cancel-in-progress: false

jobs:
  verify:
    name: Verify OIDC authentication and SSM access
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Assume AWS deploy role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::461729033931:role/github-actions-deploy-role
          aws-region: ap-northeast-2
          allowed-account-ids: '461729033931'

      - name: Run read-only commands on EC2 through SSM
        shell: bash
        run: |
          set -euo pipefail
          instance_id='i-0bb005f29438601f2'

          command_id="$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["whoami","hostname","systemctl is-active nginx"]}' \
            --query 'Command.CommandId' --output text)"

          echo "SSM command ID: $command_id"
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$instance_id"

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$instance_id" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text
